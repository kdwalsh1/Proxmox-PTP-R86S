# /etc/chrony/conf.d/gnss.conf
#
# Deployed by pi5-gm/setup.sh. Manual edits will be overwritten the next
# time setup.sh is re-run.
#
# Coarse time from gpsd's NMEA feed over shared memory segment 0, refined
# by the GPIO PPS pulse (pps-gpio overlay -> /dev/pps0), locked to the NMEA
# refclock so a PPS pulse with no NMEA sentence lock is never trusted.

refclock SHM 0 refid NMEA precision 1e-1 offset 0.192 delay 0.2 poll 0 noselect
refclock PPS /dev/pps0 refid PPS precision 1e-9 poll 0 lock NMEA prefer
